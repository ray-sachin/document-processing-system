services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dps-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dps_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dps_password}
      POSTGRES_DB: ${POSTGRES_DB:-document_processing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dps_user} -d ${POSTGRES_DB:-document_processing}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dps-network

  # Redis for Celery broker and Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: dps-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dps-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dps-backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-dps_user}:${POSTGRES_PASSWORD:-dps_password}@postgres:5432/${POSTGRES_DB:-document_processing}}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgresql://${POSTGRES_USER:-dps_user}:${POSTGRES_PASSWORD:-dps_password}@postgres:5432/${POSTGRES_DB:-document_processing}}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - STORAGE_PATH=/app/storage
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://frontend:3000}
    volumes:
      - backend_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dps-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dps-celery-worker
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-dps_user}:${POSTGRES_PASSWORD:-dps_password}@postgres:5432/${POSTGRES_DB:-document_processing}}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgresql://${POSTGRES_USER:-dps_user}:${POSTGRES_PASSWORD:-dps_password}@postgres:5432/${POSTGRES_DB:-document_processing}}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - STORAGE_PATH=/app/storage
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dps-network
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4

  # Celery Beat (for scheduled tasks if needed)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dps-celery-beat
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-dps_user}:${POSTGRES_PASSWORD:-dps_password}@postgres:5432/${POSTGRES_DB:-document_processing}}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgresql://${POSTGRES_USER:-dps_user}:${POSTGRES_PASSWORD:-dps_password}@postgres:5432/${POSTGRES_DB:-document_processing}}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - celery-worker
    networks:
      - dps-network
    command: celery -A app.worker.celery_app beat --loglevel=info

  # Flower (Celery monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dps-flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - celery-worker
    networks:
      - dps-network
    command: celery -A app.worker.celery_app flower --port=5555
    profiles:
      - monitoring

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dps-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dps-network

  # Nginx (Production reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: dps-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - dps-network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  backend_storage:

networks:
  dps-network:
    driver: bridge
